let qi=0,ans=Array(TOTAL).fill(null),time=TIME,timerHandle=null,pendingAction=null,submitted=false;
function go(id){document.querySelectorAll(&#x27;.screen&#x27;).forEach(x=&gt;x.classList.remove(&#x27;active&#x27;));document.getElementById(id).classList.add(&#x27;active&#x27;);scrollTo(0,0);updateProfile();}
function drawer(){document.getElementById(&#x27;drawer&#x27;).classList.toggle(&#x27;open&#x27;)}
function getUser(){return {name:localStorage.getItem(&#x27;gyankshetraUserName&#x27;)||&#x27;&#x27;,id:localStorage.getItem(&#x27;gyankshetraUserId&#x27;)||&#x27;&#x27;}}
function shortName(n){return (n.trim().split(/\s+/)[0]||&#x27;Name&#x27;).replace(/[^\p{L}\p{N}]/gu,&#x27;&#x27;)}
function nextNo(){return Number(localStorage.getItem(&#x27;gyankshetraNextNumber&#x27;)||1)}
function previewId(){let n=nextNo();let name=shortName(document.getElementById(&#x27;nameInput&#x27;).value)||&#x27;Name&#x27;;document.getElementById(&#x27;idPreview&#x27;).textContent=&#x27;आपकी ID: @&#x27;+String(n).padStart(2,&#x27;0&#x27;)+name}
function requireUser(action){if(getUser().name){action()}else{pendingAction=action;document.getElementById(&#x27;loginModal&#x27;).classList.add(&#x27;open&#x27;);setTimeout(()=&gt;document.getElementById(&#x27;nameInput&#x27;).focus(),100);previewId()}}
function saveUser(){let name=document.getElementById(&#x27;nameInput&#x27;).value.trim();if(!name){alert(&#x27;कृपया अपना नाम दर्ज करें।&#x27;);return}let n=nextNo();let id=&#x27;@&#x27;+String(n).padStart(2,&#x27;0&#x27;)+shortName(name);localStorage.setItem(&#x27;gyankshetraUserName&#x27;,name);localStorage.setItem(&#x27;gyankshetraUserId&#x27;,id);localStorage.setItem(&#x27;gyankshetraNextNumber&#x27;,String(n+1));document.getElementById(&#x27;loginModal&#x27;).classList.remove(&#x27;open&#x27;);updateProfile();let a=pendingAction;pendingAction=null;if(a)a()}
function changeUser(){localStorage.removeItem(&#x27;gyankshetraUserName&#x27;);localStorage.removeItem(&#x27;gyankshetraUserId&#x27;);document.getElementById(&#x27;nameInput&#x27;).value=&#x27;&#x27;;previewId();document.getElementById(&#x27;loginModal&#x27;).classList.add(&#x27;open&#x27;)}
function updateProfile(){let u=getUser();document.getElementById(&#x27;profileName&#x27;).textContent=u.name||&#x27;Gyankshetra Student&#x27;;document.getElementById(&#x27;profileId&#x27;).textContent=u.id||&#x27;Login करके अपनी ID बनाएँ&#x27;;document.getElementById(&#x27;welcome&#x27;).textContent=u.name?&#x27;नमस्ते &#x27;+u.name+&#x27; 👋&#x27;:&#x27;नमस्ते विद्यार्थी 👋&#x27;;document.getElementById(&#x27;quizUser&#x27;).textContent=u.id?u.name+&#x27; • &#x27;+u.id:&#x27;&#x27;;document.getElementById(&#x27;resultUser&#x27;).textContent=u.id?u.name+&#x27; • &#x27;+u.id:&#x27;&#x27;;let h=JSON.parse(localStorage.getItem(&#x27;gyankshetraHistory&#x27;)||&#x27;[]&#x27;);document.getElementById(&#x27;historyText&#x27;).textContent=h.length?`${h.length} टेस्ट पूरे किए • पिछला: ${h[h.length-1].marks}/50`:&#x27;अभी कोई टेस्ट नहीं दिया गया।&#x27;;let best=h.reduce((m,x)=&gt;Math.max(m,Number(x.marks)||0),0);document.getElementById(&#x27;bestScore&#x27;).textContent=best+&#x27; / 50&#x27;}
function openPopup(){document.getElementById(&#x27;questionPopup&#x27;).classList.add(&#x27;open&#x27;);renderPopup()}
function closePopup(){document.getElementById(&#x27;questionPopup&#x27;).classList.remove(&#x27;open&#x27;)}
function renderPopup(){document.getElementById(&#x27;popupPalette&#x27;).innerHTML=questions.map((_,i)=&gt;`&lt;span class=&quot;p ${ans[i]!==null?&#x27;done&#x27;:&#x27;&#x27;} ${i===qi?&#x27;cur&#x27;:&#x27;&#x27;}&quot; onclick=&quot;jumpQuestion(${i})&quot;&gt;${i+1}&lt;/span&gt;`).join(&#x27;&#x27;)}
function jumpQuestion(i){qi=i;closePopup();render()}
function startQuiz(){qi=0;ans=Array(TOTAL).fill(null);time=TIME;submitted=false;clearInterval(timerHandle);go(&#x27;quiz&#x27;);render();timerHandle=setInterval(()=&gt;{if(time&gt;0){time--;renderTimer()}else finish()},1000)}
function reattempt(){startQuiz()}
function renderTimer(){let m=Math.floor(time/60),s=time%60;document.getElementById(&#x27;timer&#x27;).textContent=String(m).padStart(2,&#x27;0&#x27;)+&#x27;:&#x27;+String(s).padStart(2,&#x27;0&#x27;)}
function render(){let q=questions[qi];document.getElementById(&#x27;qn&#x27;).textContent=(qi+1)+&#x27;/50&#x27;;document.getElementById(&#x27;num&#x27;).textContent=qi+1;document.getElementById(&#x27;question&#x27;).innerHTML=`&lt;div class=&quot;tagline&quot;&gt;${q.subject} • ${q.chapter}&lt;/div&gt;${q.q}`;document.getElementById(&#x27;options&#x27;).innerHTML=q.opts.map((o,i)=&gt;`&lt;div class=&quot;option ${ans[qi]===i?&#x27;sel&#x27;:&#x27;&#x27;}&quot; onclick=&quot;choose(${i})&quot;&gt;${String.fromCharCode(65+i)}. ${o}&lt;/div&gt;`).join(&#x27;&#x27;);document.getElementById(&#x27;analysis&#x27;).hidden=true;document.getElementById(&#x27;palette&#x27;).innerHTML=questions.map((_,i)=&gt;`&lt;span class=&quot;p ${ans[i]!==null?&#x27;done&#x27;:&#x27;&#x27;} ${i===qi?&#x27;cur&#x27;:&#x27;&#x27;}&quot; onclick=&quot;qi=${i};render()&quot;&gt;${i+1}&lt;/span&gt;`).join(&#x27;&#x27;);renderTimer()}
function choose(i){ans[qi]=i;render();renderPopup()}
function next(){if(qi&lt;TOTAL-1){qi++;render()}else finish()}
function prev(){if(qi&gt;0){qi--;render()}}
function finish(){if(submitted)return;submitted=true;clearInterval(timerHandle);timerHandle=null;closePopup();let c=ans.filter((a,i)=&gt;a===questions[i].ans).length,w=ans.filter((a,i)=&gt;a!==null&amp;&amp;a!==questions[i].ans).length,s=ans.filter(a=&gt;a===null).length;let u=getUser();let item={date:new Date().toLocaleString(&#x27;hi-IN&#x27;),test:&#x27;BPSC TRE-4 / STET • 50Q High Level&#x27;,marks:c,percentage:Math.round(c/TOTAL*100),correct:c,wrong:w,skipped:s,userId:u.id};let h=JSON.parse(localStorage.getItem(&#x27;gyankshetraHistory&#x27;)||&#x27;[]&#x27;);h.push(item);localStorage.setItem(&#x27;gyankshetraHistory&#x27;,JSON.stringify(h));document.getElementById(&#x27;score&#x27;).textContent=item.percentage+&#x27;%&#x27;;document.getElementById(&#x27;correct&#x27;).textContent=c;document.getElementById(&#x27;wrong&#x27;).textContent=w;document.getElementById(&#x27;skip&#x27;).textContent=s;document.getElementById(&#x27;marks&#x27;).textContent=c+&#x27; / 50&#x27;;go(&#x27;result&#x27;)}
function showReview(){go(&#x27;review&#x27;);let list=document.getElementById(&#x27;reviewList&#x27;);list.innerHTML=&#x27;&#x27;;questions.forEach((q,i)=&gt;{let ok=ans[i]===q.ans;let userAns=ans[i]===null?&#x27;नहीं दिया&#x27;:q.opts[ans[i]];let d=document.createElement(&#x27;div&#x27;);d.className=&#x27;reviewitem&#x27;;d.innerHTML=`&lt;div class=&quot;reviewhead&quot;&gt;&lt;span&gt;प्रश्न ${i+1} / 50&lt;/span&gt;&lt;span class=&quot;subjectbadge&quot;&gt;${q.subject} • ${q.chapter}&lt;/span&gt;&lt;/div&gt;&lt;p&gt;&lt;b&gt;${q.q}&lt;/b&gt;&lt;/p&gt;&lt;p&gt;${q.opts.map((o,j)=&gt;`${String.fromCharCode(65+j)}. ${o}`).join(&#x27;&lt;br&gt;&#x27;)}&lt;/p&gt;&lt;p class=&quot;state ${ok?&#x27;ok&#x27;:&#x27;bad&#x27;}&quot;&gt;${ok?&#x27;✅ सही&#x27;:&#x27;❌ गलत&#x27;}&lt;/p&gt;&lt;p&gt;आपका उत्तर: &lt;b&gt;${userAns}&lt;/b&gt;&lt;br&gt;सही उत्तर: &lt;b&gt;${String.fromCharCode(65+q.ans)}. ${q.opts[q.ans]}&lt;/b&gt;&lt;/p&gt;&lt;div class=&quot;important&quot;&gt;&lt;b&gt;📚 8 Important Facts / Analysis&lt;/b&gt;&lt;ol&gt;${q.facts.map(x=&gt;`&lt;li&gt;${x}&lt;/li&gt;`).join(&#x27;&#x27;)}&lt;/ol&gt;&lt;/div&gt;`;list.appendChild(d)})}
let points=&#x27;&#x27;;questions.forEach((q,i)=&gt;points+=`&lt;div class=&quot;point&quot;&gt;&lt;b&gt;प्रश्न ${i+1}: ${q.subject} • ${q.chapter}&lt;/b&gt;&lt;small&gt;सही उत्तर: ${String.fromCharCode(65+q.ans)}. ${q.opts[q.ans]}&lt;br&gt;${q.facts.slice(0,3).join(&#x27; • &#x27;)}&lt;/small&gt;&lt;/div&gt;`);document.getElementById(&#x27;pointsList&#x27;).innerHTML=points;updateProfile();
